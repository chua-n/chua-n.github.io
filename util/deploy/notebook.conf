server {
    listen       80;
    listen  [::]:80;
    server_name  chua-n.com;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/notebook/;
        index  index.html index.htm;
        # HTML / 页面：可缓存，但每次使用前必须回源确认（部署后立即生效）
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的打包文件。同一 URL 不会换成另一份内容，可以长期缓存。
    # js/css/字体允许哈希长于 8 位（同名页面撞车时 Vite 会加长）；图片必须刚好 8 位，避免 logo-apple-152.png 被算进去
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}(?:\.(?:svg|png|jpe?g|gif|webp|ico)|[A-Za-z0-9_-]*\.(?:js|css|woff2?|ttf|eot))$" {
        root /usr/share/nginx/notebook/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /ping {
        root   /usr/share/nginx/html/;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    error_page   500 502 503 504  /50x.html;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  chua-n.com;

    # SSL协议证书
    ssl_certificate     /etc/nginx/ssl/chua-n.com.pem;
    ssl_certificate_key /etc/nginx/ssl/chua-n.com.key;

    location / {
        proxy_pass   http://localhost:80;
        proxy_set_header   Host $host; # 传递原始的 Host 头
    }
}
